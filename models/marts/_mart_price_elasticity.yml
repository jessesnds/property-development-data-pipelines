version: 2

models:
  - name: mart_price_elasticity
    description: >  
      Mart layer providing analysis of key pricing and percentage-based metrics. 
      Calculations are performed at both the individual unit and project level, 
      combining insights derived from separate intermediate models. 
      The model highlights which units command a price premium and quantifies 
      the spread between highest- and lowest-performing unit types.


    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - project_id
            - unit_type

    columns:
      - name: project_id
        description: Identifier for the property development project the unit belongs to.
        data_tests:
          - not_null 

      - name: unit_type
        description: Indicates the unit type (e.g. studio, 1-bed, 2-bed, 3-bed). 
        data_tests:
          - not_null 

      - name: suburb
        description: Suburb in which the property development is located.
        data_tests:
          - not_null 

      - name: unit_type_count
        description: The total count of a particular unit type within the project.
        data_tests:
          - not_null 

      - name: unit_avg_price_per_sqm
        description: Average price per square metre for the unit type within the project
        data_tests:
          - not_null 

      - name: project_avg_price_per_sqm
        description: Average price per square metre across the project.
        data_tests:
          - not_null 

      - name: unit_stddev
        description: Standard deviation of price per square metre across units of this type within the project.
        
      - name: project_stddev
        description: Standard deviation of price per square metre across all units within the project.

      - name: min_price_per_sqm
        description: Minimum price per square metre per unit in the project.
        data_tests:
          - not_null 

      - name: max_price_per_sqm
        description: Maximum price per square metre per unit in the project.
        data_tests:
          - not_null 

      - name: price_premium_dollar
        description: Calculates difference between unit-level and project-level average price per square metre.
        data_tests:
          - not_null 

      - name: price_premium_percent
        description: Percentage difference between unit-level and project-level price per square metre.
        data_tests:
          - not_null 

      - name: coefficient_of_variation
        description: Standard deviation divided by the mean price per square metre across units.

      - name: z_score
        description: Standardised score indicating how far each unit type is from the project average.