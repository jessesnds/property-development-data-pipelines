version: 2

models:
  - name: int_profit_analysis_revenue
    description: >
      Intermediate model that aggregates all revenue metrics to one row per project.
      Sourced from stg_property_development__projects. Used downstream in the
      mart_project_profitability mart as the anchor model for financial metric calculations
      including net profit, ROI, and profit margin.

    columns:
      - name: project_id
        description: Unique identifier for each development project. Primary key of this model.
        data_tests:
          - unique
          - not_null

      - name: units_sold
        description: >
          The number of distinct units sold for the project, derived using COUNT(DISTINCT unit_id).
          This is a true transactional count and therefore not subject to the duplication
          issue that affects project-level figures like total_revenue.
        data_tests:
          - not_null

      - name: property_type
        description: >
          The most frequently occurring property type for the project, derived using MODE().
          Possible values include Apartment, Townhouse, and Mixed.
        data_tests:
          - not_null
          - accepted_values:
              values: ['Apartment', 'Townhouse', 'Mixed']

      - name: total_revenue
        description: >
          Total revenue generated by the project. Taken as MAX() across source rows
          as this is a project-level figure repeated across unit rows in the source table
          rather than a transactional value to be summed. Summing this column would
          produce inflated figures proportional to the number of source rows per project.
          This is the primary revenue metric used in the mart layer.
        data_tests:
          - not_null

      - name: avg_price_per_sqm
        description: >
          Average sale price per square metre across all units in the project.
          Calculated as AVG(price_per_sqm) and rounded to 2 decimal places.
          Useful for benchmarking pricing efficiency across projects and property types.

      - name: avg_sale_price_per_unit
        description: >
          Average final sale price per unit across all units sold in the project.
          Calculated as AVG(final_sale_price) and rounded to 2 decimal places.
          Provides a normalised revenue metric for comparing projects of different sizes.